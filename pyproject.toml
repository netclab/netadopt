[project]
name = "netadopt"
version = "0.4.0"
description = "Read a network-automation repository and adopt its model into Kubernetes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "mbakalarski", email = "64490638+mbakalarski@users.noreply.github.com" }
]
keywords = ["arista", "avd", "ansible", "kubernetes", "network automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.optional-dependencies]
# The only way netadopt finds Ansible: installed beside it, as
# `uvx "netadopt[avd]" avd <verb> ./repo` does -- see netadopt.ansible.resolve_ansible.
#
# Bounded by the AVD netadopt is tested on, the `avd` submodule: ansible-core within
# its meta/runtime.yml `requires_ansible`, pyavd at its version, and distlib and netaddr
# from its requirements.txt, whose check refuses to run without them.
avd = [
    "ansible-core>=2.16,<2.22",
    "distlib>=0.3.9",
    "netaddr>=0.7.19",
    "pyavd==6.4.0",
]

[project.urls]
Repository = "https://github.com/netclab/netadopt"
Issues = "https://github.com/netclab/netadopt/issues"
Releases = "https://github.com/netclab/netadopt/releases"

[project.scripts]
netadopt = "netadopt.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "netadopt[avd]",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["avd"]
